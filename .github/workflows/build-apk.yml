name: Build Play Store Bundle & APKs

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Custom Version Code (leave empty for automatic increment)'
        required: false
        default: ''
      version_name:
        description: 'Custom Version Name (e.g. 1.0.1)'
        required: false
        default: ''

jobs:
  build:
    name: Build AAB & APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Keystores
        run: |
          # 1. Prepare debug keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Check if a dedicated release keystore is provided via GitHub Secret
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding custom release upload keystore from secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          fi

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Play Store AAB and APKs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building Play Store Release Bundle (.aab)..."
          ./gradlew bundleRelease --stacktrace
          
          echo "Building Release and Debug APKs (.apk)..."
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: playstore-bundle-aab-run-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APKs (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-run-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30
