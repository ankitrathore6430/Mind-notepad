name: Build Play Store Bundle & APKs

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Custom Version Code (leave empty for automatic increment)'
        required: false
        default: ''
      version_name:
        description: 'Custom Version Name (e.g. 1.0.1)'
        required: false
        default: ''

jobs:
  build:
    name: Build AAB & APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Keystores
        run: |
          # 1. Prepare debug keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup production release identity keystore (For Amazon & Play Store compliance)
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using release keystore from GitHub secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PWD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PWD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "my-upload-key.jks.base64" ]; then
            echo "Decoding my-upload-key.jks from repository..."
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks
            echo "STORE_PWD=MindNotepadRelease2026" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=upload" >> $GITHUB_ENV
            echo "KEY_PWD=MindNotepadRelease2026" >> $GITHUB_ENV
          elif [ -f "my-upload-key.jks" ]; then
            echo "Found existing my-upload-key.jks..."
            echo "STORE_PWD=MindNotepadRelease2026" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=upload" >> $GITHUB_ENV
            echo "KEY_PWD=MindNotepadRelease2026" >> $GITHUB_ENV
          else
            echo "Generating dedicated identity release keystore for Ankit Rathore..."
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -storepass MindNotepadRelease2026 \
              -keypass MindNotepadRelease2026 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Ankit Rathore,OU=Mind Notepad,O=Ankit Rathore,L=Delhi,ST=Delhi,C=IN"
            echo "STORE_PWD=MindNotepadRelease2026" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=upload" >> $GITHUB_ENV
            echo "KEY_PWD=MindNotepadRelease2026" >> $GITHUB_ENV
          fi

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Play Store AAB and APKs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          STORE_PASSWORD: ${{ env.STORE_PWD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS_VAL }}
          KEY_PASSWORD: ${{ env.KEY_PWD }}
        run: |
          echo "=== Build Environment ==="
          echo "GitHub Run Number: $GITHUB_RUN_NUMBER"
          echo "Custom Version Code: '$VERSION_CODE'"
          echo "Custom Version Name: '$VERSION_NAME'"
          
          echo "Building Play Store Release Bundle (.aab)..."
          ./gradlew bundleRelease --stacktrace
          
          echo "Building Release and Debug APKs (.apk)..."
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: playstore-bundle-aab-run-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APKs (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-run-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release Keystore (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup-run-${{ github.run_number }}
          path: my-upload-key.jks
          retention-days: 90
